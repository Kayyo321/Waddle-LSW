name: Software vGPU verification
on:
  push:
    branches: [feature/software-vgpu-slicing]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: debian:trixie-slim
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install transport build and coverage tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl xz-utils build-essential clang-19 llvm-19 python3 python3-yaml python3-mako meson ninja-build pkg-config libvulkan-dev libepoxy-dev libdrm-dev mesa-vulkan-drivers libwayland-dev wayland-protocols
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false
      - name: Install verified Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      - name: Check out immutable Venus renderer dependency
        run: git submodule update --init --depth 1 submodules/virglrenderer submodules/looking_glass submodules/venus_protocol
      - name: Build Venus renderer without dependency downloads
        run: make vgpu-renderer
      - name: Verify pinned guest encoder against exact receiver schema
        run: make vgpu-protocol-test
      - name: Verify C and Zig libc linking boundary
        run: make vgpu-libc-test vgpu-libc-sanitizers
      - name: Verify real Venus CPU dispatch and receiver ownership
        run: make vgpu-receiver-test vgpu-receiver-sanitizers vgpu-receiver-coverage
      - name: Verify real Venus queue protocol with software Vulkan backend
        run: |
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -maxdepth 1 -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          make vgpu-gpu-unit vgpu-gpu-test vgpu-gpu-sanitizers
      - name: Verify pinned capability snapshots and compatibility
        run: make vgpu-capabilities-test vgpu-capabilities-sanitizers vgpu-capabilities-coverage
      - name: Verify image layouts and complete DMA-BUF feedback
        run: make vgpu-dmabuf-test vgpu-dmabuf-sanitizers vgpu-dmabuf-coverage
      - name: Verify guest Vulkan object identity and lifetime
        run: make vgpu-objects-test vgpu-objects-sanitizers vgpu-objects-coverage
      - name: Verify exclusive serialized guest command ownership
        run: make vgpu-command-test vgpu-command-sanitizers vgpu-command-coverage
      - name: Verify negotiated guest frontend ownership
        run: make vgpu-guest-test vgpu-guest-sanitizers vgpu-guest-coverage
      - name: Verify Wayland import pacing and release ownership
        run: make vgpu-present-test vgpu-present-sanitizers vgpu-present-coverage
      - name: Verify standalone render-only adapter ownership
        run: make vgpu-wddm-test vgpu-wddm-sanitizers vgpu-wddm-coverage
      - name: Verify credential-bound frame descriptor handoff
        run: make vgpu-frame-test vgpu-frame-sanitizers vgpu-frame-coverage
      - name: Verify presented production worker exec binding
        run: make vgpu-presented-worker-test vgpu-presented-worker-sanitizers
      - name: Verify bounded worker export leases
        run: make vgpu-export-test vgpu-export-sanitizers vgpu-export-coverage
      - name: Verify worker surface binding ownership
        run: make vgpu-surface-test vgpu-surface-sanitizers vgpu-surface-coverage
      - name: Verify native Wayland wire and frame FD integration
        run: make vgpu-present-integration vgpu-present-integration-sanitizers build/vgpu_image_integration build/vgpu_remote_image_integration
      - name: Verify portable receiver request envelopes
        run: make vgpu-request-test vgpu-request-sanitizers vgpu-request-coverage
      - name: Verify isolated receiver process ownership
        run: make vgpu-worker-test vgpu-worker-sanitizers vgpu-worker-coverage
      - name: Verify bounded isolated context ownership
        run: make vgpu-context-test vgpu-context-sanitizers vgpu-context-coverage
      - name: Verify isolated receiver service acquisition and cleanup
        run: make vgpu-service-test vgpu-service-sanitizers vgpu-service-coverage
      - name: Verify bounded receiver runtime and failure paths
        run: make vgpu-runtime-test vgpu-runtime-sanitizers vgpu-runtime-coverage
      - name: Verify independent mapped-file guest and real Venus replies
        run: make vgpu-integration vgpu-integration-sanitizers
      - name: Verify simultaneous context execution and crash isolation
        run: make vgpu-context-integration vgpu-context-integration-sanitizers
      - name: Verify ring safety and independent-process ordering
        run: make vgpu-test vgpu-sanitizers
      - name: Gate production C and Zig transport coverage
        run: make vgpu-coverage
      - name: Cross-link Windows ABI fixture
        run: make vgpu-windows
  windows_transport:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false
      - name: Install verified Zig
        shell: pwsh
        run: |
          Invoke-WebRequest https://ziglang.org/download/0.13.0/zig-windows-x86_64-0.13.0.zip -OutFile "$env:RUNNER_TEMP/zig.zip"
          if ((Get-FileHash "$env:RUNNER_TEMP/zig.zip" -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158') { throw 'Zig checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP/zig.zip" "$env:RUNNER_TEMP/zig"
          "$env:RUNNER_TEMP/zig/zig-windows-x86_64-0.13.0" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Check out pinned signed-driver declarations
        run: git submodule update --init --depth 1 submodules/looking_glass
      - name: Build and run native Windows transport and allocator tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          zig build-lib src/vgpu/venus_bounds.zig -static -target x86_64-windows-gnu -O ReleaseSafe -fno-compiler-rt '-femit-bin=build/venus_bounds_windows.lib'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu tests/vgpu/ring.c src/vgpu/venus_ring.c build/venus_bounds_windows.lib -o build/vgpu_ring_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_ring_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu tests/vgpu/region.c src/vgpu/venus_region.c src/vgpu/venus_ring.c build/venus_bounds_windows.lib -o build/vgpu_region_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_region_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu -Isubmodules/looking_glass/vendor/ivshmem tests/vgpu/mapping_windows.c src/vgpu/venus_region.c src/vgpu/venus_ring.c build/venus_bounds_windows.lib -o build/vgpu_mapping_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_mapping_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu tests/vgpu/wait.c src/vgpu/venus_wait.c src/vgpu/venus_ring.c build/venus_bounds_windows.lib -o build/vgpu_wait_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_wait_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build-lib src/vgpu/venus_control.zig -static -target x86_64-windows-gnu -O ReleaseSafe -fno-compiler-rt '-femit-bin=build/venus_control_windows.lib'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu tests/vgpu/session.c src/vgpu/venus_session.c src/vgpu/venus_region.c src/vgpu/venus_ring.c build/venus_control_windows.lib build/venus_bounds_windows.lib -o build/vgpu_session_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_session_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu tests/vgpu/channel_windows.c src/vgpu/venus_channel.c src/vgpu/venus_session.c src/vgpu/venus_region.c src/vgpu/venus_ring.c src/vgpu/venus_wait.c src/vgpu/venus_stream_windows.c build/venus_bounds_windows.lib build/venus_control_windows.lib -o build/vgpu_channel_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_channel_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig test src/vgpu/venus_control.zig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig test src/vgpu/venus_bounds.zig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build-lib src/vgpu/venus_capabilities.zig -static -target x86_64-windows-gnu -O ReleaseSafe -fno-compiler-rt '-femit-bin=build/venus_capabilities_windows.lib'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/vgpu/capabilities.c build/venus_capabilities_windows.lib -o build/vgpu_capabilities_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_capabilities_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig test src/vgpu/venus_capabilities.zig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig build-lib src/vgpu/venus_request.zig -static -target x86_64-windows-gnu -O ReleaseSafe -fno-compiler-rt '-femit-bin=build/venus_request_windows.lib'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/vgpu/request.c build/venus_request_windows.lib -o build/vgpu_request_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_request_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig test src/vgpu/venus_request.zig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu tests/vgpu/runtime.c src/vgpu/venus_rpc.c src/vgpu/venus_dispatch.c src/vgpu/venus_session.c src/vgpu/venus_region.c src/vgpu/venus_ring.c src/vgpu/venus_wait.c build/venus_request_windows.lib build/venus_capabilities_windows.lib build/venus_bounds_windows.lib build/venus_control_windows.lib -o build/vgpu_runtime_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_runtime_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Windows image metadata ABI
        shell: pwsh
        run: |
          zig build-lib src/vgpu/venus_dmabuf.zig -static -target x86_64-windows-gnu -O ReleaseSafe -fno-compiler-rt -lc '-femit-bin=build/venus_dmabuf_windows.lib'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/vgpu/dmabuf.c build/venus_dmabuf_windows.lib -o build/vgpu_dmabuf_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_dmabuf_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig test src/vgpu/venus_dmabuf.zig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Windows negotiated frontend ownership
        shell: pwsh
        run: |
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/vgpu/guest.c src/vgpu/venus_guest.c build/venus_capabilities_windows.lib -o build/vgpu_guest_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_guest_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Windows Vulkan object storage ABI
        shell: pwsh
        run: |
          zig build-lib src/vgpu/venus_objects.zig -Iinclude -static -target x86_64-windows-gnu -O ReleaseSafe -fno-compiler-rt -lc '-femit-bin=build/venus_objects_windows.lib'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/vgpu/objects.c build/venus_objects_windows.lib -o build/vgpu_objects_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_objects_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig test src/vgpu/venus_objects.zig -Iinclude -lc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Windows command staging ABI
        shell: pwsh
        run: |
          zig build-lib src/vgpu/venus_command.zig -Iinclude -static -target x86_64-windows-gnu -O ReleaseSafe -fno-compiler-rt -lc '-femit-bin=build/venus_command_windows.lib'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/vgpu/command.c build/venus_command_windows.lib -o build/vgpu_command_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_command_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig test src/vgpu/venus_command.zig -Iinclude -lc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Windows standalone adapter and DLL ABI
        shell: pwsh
        run: |
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu tests/vgpu/wddm.c src/vgpu/venus_wddm.c build/venus_request_windows.lib -o build/vgpu_wddm_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_wddm_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude -Isrc/vgpu -shared src/vgpu/venus_wddm.def src/vgpu/venus_wddm.c src/vgpu/venus_guest.c src/vgpu/venus_rpc.c src/vgpu/venus_channel.c src/vgpu/venus_session.c src/vgpu/venus_region.c src/vgpu/venus_ring.c src/vgpu/venus_wait.c src/vgpu/venus_stream_windows.c build/venus_bounds_windows.lib build/venus_control_windows.lib build/venus_request_windows.lib build/venus_capabilities_windows.lib -o build/waddle_userland_adapter.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/vgpu/wddm_dll.c -o build/vgpu_wddm_dll_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_wddm_dll_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Windows presentation frame codec ABI
        shell: pwsh
        run: |
          zig build-lib src/vgpu/venus_frame.zig -Iinclude -static -target x86_64-windows-gnu -O ReleaseSafe -fno-compiler-rt -lc '-femit-bin=build/venus_frame_windows.lib'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig cc -target x86_64-windows-gnu -std=c11 -Wall -Wextra -Wpedantic -Werror -Iinclude tests/vgpu/frame_codec.c build/venus_frame_windows.lib -o build/vgpu_frame_codec_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./build/vgpu_frame_codec_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          zig test src/vgpu/venus_frame.zig -Iinclude -lc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
