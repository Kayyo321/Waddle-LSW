name: Linux CLI verification
on:
  push:
    branches: [feature/initial-cli-passthrough]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: debian:trixie-slim
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install base build and coverage packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl xz-utils build-essential kcov clang-19 llvm-19 python3 python3-venv meson ninja-build pkg-config libglib2.0-dev libpixman-1-dev zlib1g-dev qemu-utils virtiofsd
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          persist-credentials: false
      - name: Synchronize exact submodule pins via advertised OpenSSL tag
        shell: bash
        run: sh scripts/ci_submodules.sh
      - name: Install verified Zig toolchain
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      - name: Run sanitizer and allocator suites
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
          LSAN_OPTIONS: abort_on_error=1
        run: make test-sanitizers
      - name: Enforce implementation coverage
        run: |
          make clean
          make coverage
      - name: Run 1000 device storage cycles with concurrent readers
        run: make device-stress
      - name: Cross-build Windows guest and fixture
        run: make windows build/windows_guest_test.exe
