name: Seamless interop verification
on:
  push:
    branches: [feat/seamless-interop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    container:
      image: debian:trixie-slim
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    steps:
      - name: Install base build and platform development packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl xz-utils build-essential pkg-config libwayland-dev wayland-protocols libpipewire-0.3-dev clang-19 llvm-19 python3 procps
          git config --global --add safe.directory '*'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          submodules: false
          persist-credentials: false
      - name: Check out pinned driver ABI dependency
        run: git submodule update --init --depth 1 submodules/looking_glass
      - name: Install verified Zig
        run: |
          curl -fsSL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "d45312e61ebcc48032b77bc4cf7fd6915c11fa16e4aad116b66c9468211230ea  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      - name: Run hardware-free interop gates
        run: make interop-test
      - name: Run interop C consumers under ASan/LSan/UBSan
        run: make interop-sanitizers
      - name: Gate each implemented interop module's line/branch coverage
        run: make interop-coverage
      - name: Cross-build Windows ABI and foundation tests
        run: make build/interop_codec_abi_test.exe build/interop_layout_test.exe build/interop_heap_test.exe build/interop_manifest_test.exe build/interop_layout_abi_test.exe build/interop_native_atomic_test.exe build/interop_slot_runtime_test.exe build/interop_slot_runtime_abi_test.exe build/interop_slot_runtime_abi_unit_test.exe build/interop_mapping_init_test.exe build/interop_stream_reader_test.exe build/interop_stream_send_queue_test.exe build/interop_session_liveness_test.exe build/interop_session_handshake_test.exe build/interop_agent_version_test.exe build/interop_request_ids_test.exe build/interop_mapping_windows_sdk.o build/interop_mapping_windows_test.exe build/interop_host_buffer_registry_test.exe build/interop_host_buffer_registry_adversarial_test.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interop-codec-windows
          path: |
            build/interop_codec_abi_test.exe
            build/interop_layout_test.exe
            build/interop_heap_test.exe
            build/interop_manifest_test.exe
            build/interop_layout_abi_test.exe
            build/interop_native_atomic_test.exe
            build/interop_slot_runtime_test.exe
            build/interop_slot_runtime_abi_test.exe
            build/interop_slot_runtime_abi_unit_test.exe
            build/interop_mapping_init_test.exe
            build/interop_stream_reader_test.exe
            build/interop_stream_send_queue_test.exe
            build/interop_session_liveness_test.exe
            build/interop_session_handshake_test.exe
            build/interop_agent_version_test.exe
            build/interop_request_ids_test.exe
            build/interop_mapping_windows_test.exe
            build/interop_host_buffer_registry_test.exe
            build/interop_host_buffer_registry_adversarial_test.exe
          if-no-files-found: error
  windows:
    needs: linux
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: interop-codec-windows
          path: build
      - name: Run ABI and foundation tests natively on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($test_name in @('interop_codec_abi_test.exe', 'interop_layout_test.exe', 'interop_heap_test.exe', 'interop_manifest_test.exe', 'interop_layout_abi_test.exe', 'interop_native_atomic_test.exe', 'interop_slot_runtime_test.exe', 'interop_slot_runtime_abi_test.exe', 'interop_slot_runtime_abi_unit_test.exe', 'interop_mapping_init_test.exe', 'interop_stream_reader_test.exe', 'interop_stream_send_queue_test.exe', 'interop_session_liveness_test.exe', 'interop_session_handshake_test.exe', 'interop_agent_version_test.exe', 'interop_request_ids_test.exe', 'interop_mapping_windows_test.exe', 'interop_host_buffer_registry_test.exe', 'interop_host_buffer_registry_adversarial_test.exe')) {
            & ".\build\$test_name"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
